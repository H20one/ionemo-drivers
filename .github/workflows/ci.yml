name: CI

# Same acceptance -> PR -> main flow as the other three repos. Contributions land on
# `acceptance` first so a driver can be exercised against the app's ACC deployment
# before it reaches `main`; `main` is what ionemo-app pins a release tag from.
#
# `pull_request` covers both branches so a fork's PR is checked before it is merged
# anywhere, and the push trigger re-runs the suite on the branch itself after a merge.
on:
  push:
    branches: [main, acceptance]
  pull_request:
    branches: [main, acceptance]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install package + dev dependencies
        run: |
          pip install --quiet -e .
          pip install --quiet -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (basedpyright)
        run: basedpyright

      - name: Contract + security compliance tests
        run: pytest tests/ -v --cov=ionemo_drivers --cov-report=term-missing
